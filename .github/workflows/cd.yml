
name: ShopNest CD

on:
  workflow_run:
    workflows:
      - "ShopNest CI"
    types:
      - completed
    branches:
      - staging
      - main

permissions:
  actions: read
  contents: read

jobs:

  # ==========================================
  # STAGING DEPLOYMENT
  # ==========================================
  staging-deploy:
    name: Deploy to Staging

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'staging'

    runs-on: ubuntu-latest

    environment:
      name: staging

    concurrency:
      group: shopnest-staging-deployment
      cancel-in-progress: false

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
   

      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/ShopNest-staging' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'shopnest-staging' }}
      APP_PORT: ${{ vars.APP_PORT || '3001' }}

      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:

      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: shopnest-release
          path: ./release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify release
        run: |
          set -e

          test -f ./release/server.js
          test -f ./release/package.json
          test -f ./release/package-lock.json
          test -d ./release/public

          echo "Staging release verified."

      - name: Configure SSH
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "echo 'Staging SSH connection successful'"

      - name: Create staging directory
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      - name: Upload staging release
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SERVER_PORT -o StrictHostKeyChecking=yes" \
            ./release/ \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

      - name: Install and restart staging
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$SERVICE_NAME' '$APP_PORT' '$DEPLOYED_SHA'" <<'REMOTE'
          set -e

          DEPLOY_PATH="$1"
          SERVICE_NAME="$2"
          APP_PORT="$3"
          DEPLOYED_SHA="$4"

          cd "$DEPLOY_PATH"

          npm ci --omit=dev

          sudo systemctl restart "$SERVICE_NAME"

          sudo systemctl is-active --quiet "$SERVICE_NAME"

          echo "Waiting for staging health check..."

          for i in $(seq 1 30); do
            if curl --fail --silent \
              "http://127.0.0.1:${APP_PORT}/health"; then

              echo
              echo "Staging health check successful."

              echo "$DEPLOYED_SHA" > "$DEPLOY_PATH/DEPLOYED_COMMIT"

              exit 0
            fi

            echo "Waiting for staging application... attempt $i"
            sleep 2
          done

          echo "Staging health check failed."

          sudo systemctl status "$SERVICE_NAME" --no-pager || true
          sudo journalctl -u "$SERVICE_NAME" -n 50 --no-pager || true

          exit 1
          REMOTE

      - name: Staging deployment summary
        run: |
          echo "Staging deployment successful."
          echo "Commit: $DEPLOYED_SHA"
          echo "Port: $APP_PORT"


  # ==========================================
  # PRODUCTION DEPLOYMENT
  # ==========================================
  production-deploy:
    name: Deploy to Production

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    # IMPORTANT: Production GitHub Environment
    environment:
      name: production

    concurrency:
      group: shopnest-production-deployment
      cancel-in-progress: false

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      

      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/ShopNest' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'shopnest' }}
      APP_PORT: ${{ vars.APP_PORT || '3000' }}

      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:

      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: shopnest-release
          path: ./release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify release
        run: |
          set -e

          test -f ./release/server.js
          test -f ./release/package.json
          test -f ./release/package-lock.json
          test -d ./release/public

          echo "Production release verified."

      - name: Configure SSH
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "echo 'Production SSH connection successful'"

      - name: Create production directory
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      - name: Upload production release
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SERVER_PORT -o StrictHostKeyChecking=yes" \
            ./release/ \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

      - name: Install and restart production
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$SERVICE_NAME' '$APP_PORT' '$DEPLOYED_SHA'" <<'REMOTE'
          set -e

          DEPLOY_PATH="$1"
          SERVICE_NAME="$2"
          APP_PORT="$3"
          DEPLOYED_SHA="$4"

          cd "$DEPLOY_PATH"

          npm ci --omit=dev

          sudo systemctl restart "$SERVICE_NAME"

          sudo systemctl is-active --quiet "$SERVICE_NAME"

          echo "Waiting for production health check..."

          for i in $(seq 1 30); do
            if curl --fail --silent \
              "http://127.0.0.1:${APP_PORT}/health"; then

              echo
              echo "Production health check successful."

              echo "$DEPLOYED_SHA" > "$DEPLOY_PATH/DEPLOYED_COMMIT"

              exit 0
            fi

            echo "Waiting for production application... attempt $i"
            sleep 2
          done

          echo "Production health check failed."

          sudo systemctl status "$SERVICE_NAME" --no-pager || true
          sudo journalctl -u "$SERVICE_NAME" -n 50 --no-pager || true

          exit 1
          REMOTE

      - name: Production deployment summary
        run: |
          echo "Production deployment successful."
          echo "Commit: $DEPLOYED_SHA"
          echo "Port: $APP_PORT"
